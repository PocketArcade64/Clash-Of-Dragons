<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clash of Dragons</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clash of Dragons">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0a0c14; --bg2:#070811;
    --panel:rgba(17,20,31,.78);
    --edge:rgba(232,184,75,.28);
    --gold:#e8b84b; --gold-soft:#f5d98a;
    --ink:#eef1fb; --muted:#9aa1bf;
    --atk:#ff4338; --grb:#3ddc84; --grd:#3fc6ff; --parry:#ffe27a;
    --p1:#2f6bff; --p2:#ff5a8a;
    --hp-hi:#ff3b30;
    --display:Impact,"Haettenschweiler","Arial Narrow Bold","Franklin Gothic Bold",sans-serif;
    --ui:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);
    font-family:var(--ui);touch-action:none;user-select:none;-webkit-user-select:none;}
  #app{position:fixed;inset:0;}
  canvas{display:block;position:fixed;inset:0;z-index:0;}
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;}

  #topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;
    gap:clamp(6px,1.4vw,18px);
    padding-top:clamp(8px,1.6vh,16px);padding-bottom:0;
    padding-left:calc(clamp(18px,4vw,34px) + env(safe-area-inset-left));
    padding-right:calc(clamp(18px,4vw,34px) + env(safe-area-inset-right));}
  .side{flex:1;min-width:0;} .side.r{text-align:right;}
  .nameplate{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;}
  .side.r .nameplate{flex-direction:row-reverse;}
  .pname{font-family:var(--display);font-size:clamp(15px,2.7vw,26px);letter-spacing:.04em;color:#0b0d16;
    text-transform:uppercase;font-style:italic;line-height:1;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.55);}
  .ptitle{font-size:clamp(8px,1.3vw,12px);color:#0b0d16;text-transform:uppercase;letter-spacing:.16em;white-space:nowrap;}
  .hpwrap{position:relative;height:clamp(13px,2.1vh,20px);background:rgba(0,0,0,.55);
    border:1.5px solid rgba(255,255,255,.16);border-radius:3px;overflow:hidden;
    box-shadow:0 0 18px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.05);}
  .hpfill{position:absolute;top:0;bottom:0;width:100%;
    background:linear-gradient(180deg,#ffd27a 0%,var(--hp-hi) 18%,#c41208 100%);
    transition:width .16s cubic-bezier(.2,.8,.2,1);}
  .hpghost{position:absolute;top:0;bottom:0;width:100%;background:rgba(255,255,255,.6);transition:width .5s ease .1s;opacity:.5;}
  .side.l .hpfill,.side.l .hpghost{left:0;} .side.r .hpfill,.side.r .hpghost{right:0;}
  .pips{display:flex;gap:6px;margin-top:6px;} .side.r .pips{justify-content:flex-end;}
  .pip{width:clamp(9px,1.5vw,14px);height:clamp(9px,1.5vw,14px);border-radius:50%;
    border:1.5px solid var(--edge);background:rgba(0,0,0,.4);}
  .pip.on{background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold));
    box-shadow:0 0 10px var(--gold);border-color:var(--gold);}
  #center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px;}
  #roundlbl{font-family:var(--display);font-size:clamp(11px,1.7vw,16px);color:var(--atk);letter-spacing:.22em;text-transform:uppercase;text-shadow:0 1px 2px rgba(255,255,255,.5);}
  #timer{font-family:var(--display);font-size:clamp(22px,4.4vw,40px);line-height:.9;color:#0b0d16;text-shadow:0 1px 2px rgba(255,255,255,.6),0 0 4px rgba(255,255,255,.4);font-variant-numeric:tabular-nums;}
  #timer.low{color:var(--atk);animation:pulse .7s infinite;}
  @keyframes pulse{50%{opacity:.45;}}

  .tgbadge{position:absolute;top:30%;transform:translate(-50%,-50%) scale(.7);display:none;
    flex-direction:column;align-items:center;gap:2px;pointer-events:none;padding:9px 15px;border-radius:14px;
    border:3px solid currentColor;background:rgba(8,10,18,.74);box-shadow:0 0 28px currentColor;}
  .tgbadge.show{display:flex;animation:tgpop .14s ease-out forwards;}
  @keyframes tgpop{to{transform:translate(-50%,-50%) scale(1);}}
  .tgbadge .tgi{font-size:clamp(24px,4.6vw,40px);line-height:1;}
  .tgbadge .tgt{font-family:var(--display);font-style:italic;letter-spacing:.08em;font-size:clamp(12px,1.9vw,18px);color:#fff;}
  #tg1,#st1{left:28%;} #tg2,#st2{left:72%;}
  .stun{color:#cbd2ef;top:24%;}

  #controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding-top:clamp(6px,1.6vh,16px);
    padding-bottom:calc(clamp(6px,1.6vh,16px) + env(safe-area-inset-bottom));
    padding-left:calc(clamp(8px,2vw,24px) + env(safe-area-inset-left));
    padding-right:calc(clamp(8px,2vw,24px) + env(safe-area-inset-right));}
  .pad{position:relative;}
  .tri{position:relative;width:clamp(178px,27vw,240px);height:clamp(178px,27vw,240px);}
  .btn{position:absolute;pointer-events:auto;border:none;cursor:pointer;color:#fff;font-family:var(--display);
    text-transform:uppercase;font-style:italic;letter-spacing:.04em;width:clamp(50px,7.6vw,76px);height:clamp(50px,7.6vw,76px);
    border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transform:translate(-50%,-50%);box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.14) inset;
    transition:transform .06s,box-shadow .06s,filter .12s,opacity .12s;}
  .btn .ico{font-size:clamp(18px,3vw,26px);line-height:1;} .btn .lab{font-size:clamp(9px,1.3vw,11px);}
  .btn:active{transform:translate(-50%,-50%) scale(.92);box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.14) inset;}
  .btn.atk{background:radial-gradient(circle at 38% 30%,#ff8a7e,#c41d12);}
  .btn.grd{background:radial-gradient(circle at 38% 30%,#86dcff,#137bb8);}
  .btn.grb{background:radial-gradient(circle at 38% 30%,#7ff0ad,#16934f);}
  #pad1 .btn.atk{left:18%;top:32%;} #pad1 .btn.grd{left:49%;top:42%;} #pad1 .btn.grb{left:69%;top:68%;}
  #pad2 .btn.atk{left:82%;top:32%;} #pad2 .btn.grd{left:51%;top:42%;} #pad2 .btn.grb{left:31%;top:68%;}
  .btn.held{transform:translate(-50%,-50%) scale(.9);box-shadow:0 0 0 4px #fff inset,0 0 26px var(--grd);filter:brightness(1.25);}
  .btn.locked{opacity:.34;filter:grayscale(.55);cursor:default;}

  .ultwrap{position:absolute;width:clamp(60px,9vw,86px);height:clamp(60px,9vw,86px);}
  #pad1 .ultwrap{left:2%;bottom:2%;} #pad2 .ultwrap{right:2%;bottom:2%;}
  .ultwrap svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible;}
  .ring-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:8;}
  .ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .35s ease;}
  .ultbtn{pointer-events:auto;position:absolute;inset:13%;border-radius:50%;border:none;cursor:default;
    background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.12),rgba(0,0,0,.5));color:var(--muted);
    font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:clamp(10px,1.5vw,15px);
    letter-spacing:.04em;line-height:1.05;box-shadow:0 0 0 2px rgba(255,255,255,.08) inset;transition:transform .1s,filter .15s;}
  .ultbtn.ready{cursor:pointer;color:#fff;animation:ultpulse 1s infinite;}
  .ultbtn.ready:active{transform:scale(.92);}
  @keyframes ultpulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.55);}}
  .ultname{display:none;}

  .screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;
    text-align:center;pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 90% at 50% 0%,rgba(20,24,40,.86),rgba(6,7,16,.97));padding:24px;}
  .screen.show{display:flex;}
  .screen::before,.screen::after{content:"";margin-block:auto;flex:0 0 0;}
  .logo{font-family:var(--display);font-style:italic;text-transform:uppercase;line-height:.86;font-size:clamp(46px,12vw,128px);
    letter-spacing:.01em;padding:0 .16em .1em;overflow:visible;
    background:linear-gradient(180deg,#fff 0%,var(--gold-soft) 45%,var(--gold) 70%,#9a6a12 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 38px rgba(232,184,75,.25);
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.4));}
  .logo .sm{display:block;font-size:.34em;letter-spacing:.5em;color:var(--gold);background:none;-webkit-text-fill-color:var(--gold);margin-bottom:.1em;padding-left:.5em;}
  .chart{margin-top:18px;}
  .chart svg{width:clamp(248px,40vw,360px);height:auto;}
  .chart .arc{fill:none;stroke:var(--gold);stroke-width:3.4;opacity:.9;stroke-linecap:round;}
  .chart .ndlabel{font-family:var(--display);font-style:italic;fill:#fff;text-anchor:middle;letter-spacing:.04em;}
  .chart .ndicon{text-anchor:middle;dominant-baseline:central;}
  .chart .cap{fill:var(--muted);text-anchor:middle;font-size:clamp(9px,2.4vw,13px);letter-spacing:.1em;text-transform:uppercase;}
  .cta{margin-top:26px;font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.14em;
    font-size:clamp(18px,3.2vw,28px);color:#fff;border:2px solid var(--gold);background:rgba(232,184,75,.12);
    padding:14px 40px;border-radius:999px;cursor:pointer;transition:transform .1s;animation:pulse 1.8s infinite;}
  .cta:active{transform:scale(.96);}

  #select .seltitle{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:clamp(22px,4.4vw,44px);letter-spacing:.05em;}
  #select .selsub{color:var(--muted);margin:6px 0 22px;letter-spacing:.04em;}
  .cards{display:flex;gap:clamp(8px,1.4vw,18px);flex-wrap:wrap;justify-content:center;max-width:1100px;}
  .card{width:clamp(120px,15vw,180px);background:var(--panel);border:2px solid rgba(255,255,255,.08);border-radius:16px;
    overflow:hidden;cursor:pointer;transition:transform .12s,border-color .15s,box-shadow .15s;}
  .card:active{transform:scale(.97);}
  .card.taken{opacity:.32;pointer-events:none;filter:grayscale(.7);}
  .card .art{height:clamp(74px,11vw,118px);position:relative;}
  .card .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.22),transparent 60%);}
  .card .meta{padding:10px 12px 14px;}
  .card .cn{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:clamp(11px,1.8vw,20px);letter-spacing:.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .ct{font-size:clamp(9px,1.3vw,11px);color:var(--muted);text-transform:uppercase;letter-spacing:.13em;margin-top:3px;}
  .card .cu{font-size:clamp(10px,1.4vw,12px);margin-top:9px;color:var(--gold-soft);font-weight:600;}
  .card .cd{font-size:clamp(10px,1.3vw,12px);margin-top:3px;color:var(--muted);line-height:1.35;}
  .card:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(232,184,75,.18);}
  .card .art .port{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
  .card .art .port3d{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));}
  .card.drop{border-color:var(--gold);box-shadow:0 0 30px rgba(232,184,75,.4);transform:scale(1.03);}
  .card.sel0{border-color:var(--p1);box-shadow:0 0 26px rgba(47,107,255,.55);}
  .card.sel1{border-color:var(--p2);box-shadow:0 0 26px rgba(255,90,138,.55);}
  .card.sel0.sel1{box-shadow:0 0 26px rgba(47,107,255,.5),0 0 40px rgba(255,90,138,.4);}

  #tokenrow{display:flex;gap:clamp(20px,5vw,46px);margin-top:18px;height:60px;align-items:center;justify-content:center;}
  #tokenrow .hint{position:absolute;transform:translateY(46px);font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
  .token{width:clamp(46px,7vw,58px);height:clamp(46px,7vw,58px);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-style:italic;font-size:clamp(16px,2.6vw,21px);color:#fff;cursor:grab;touch-action:none;
    border:3px solid rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(0,0,0,.5);user-select:none;
    transition:transform .12s,box-shadow .12s;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  #tok0{background:radial-gradient(circle at 38% 30%,#a9c2ff,var(--p1));}
  #tok1{background:radial-gradient(circle at 38% 30%,#ffc0d4,var(--p2));}
  .token.dragging{cursor:grabbing;transform:scale(1.14);box-shadow:0 9px 24px rgba(0,0,0,.6);z-index:60;}
  .token.placed{position:fixed;z-index:50;margin:0;}

  .cta.locked,.cta:disabled{opacity:.4;filter:grayscale(.6);cursor:default;animation:none;
    border-color:rgba(255,255,255,.25);color:var(--muted);background:rgba(255,255,255,.05);}

  #result .rtitle{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:clamp(30px,7vw,76px);letter-spacing:.03em;line-height:.95;}
  #result .rsub{color:var(--muted);margin-top:10px;font-size:clamp(13px,2vw,18px);letter-spacing:.06em;}

  #announce{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  #announce span{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:clamp(34px,9vw,108px);
    letter-spacing:.04em;line-height:.9;text-align:center;background:linear-gradient(180deg,#fff,var(--gold) 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 0 40px rgba(232,184,75,.4));opacity:0;transform:scale(.6);}
  #announce.go span{animation:announce 1.05s cubic-bezier(.18,.9,.2,1) forwards;}
  @keyframes announce{0%{opacity:0;transform:scale(.5) rotate(-4deg);}18%{opacity:1;transform:scale(1.08) rotate(0);}70%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.18);}}

  #err{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;text-align:center;
    padding:30px;background:var(--bg2);color:var(--muted);font-size:16px;line-height:1.6;}
  @media (max-height:540px){
    .screen{padding:10px 18px;}
    .logo{font-size:clamp(30px,10vh,72px);}
    .logo .sm{font-size:.3em;margin-bottom:.04em;}
    .chart{margin-top:8px;}
    .chart svg{width:auto;height:min(40vh,210px);}
    .cta{margin-top:12px;padding:9px 30px;font-size:clamp(14px,4.2vh,22px);}
    #select .seltitle{font-size:clamp(18px,5.5vh,36px);}
    #select .selsub{margin:4px 0 8px;font-size:clamp(10px,2.6vh,13px);}
    .cards{gap:8px;}
    .card{width:clamp(92px,17vh,150px);border-radius:12px;}
    .card .art{height:clamp(50px,11vh,96px);}
    .card .meta{padding:6px 9px 9px;}
    .card .cd{display:none;}
    #tokenrow{height:48px;margin-top:8px;gap:clamp(18px,6vw,40px);}
    .token{width:clamp(42px,8vh,54px);height:clamp(42px,8vh,54px);}
    #result .rtitle{font-size:clamp(24px,9vh,60px);}
    #result .rsub{margin-top:6px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="topbar">
    <div class="side l">
      <div class="nameplate"><span class="pname" id="p1name">—</span><span class="ptitle" id="p1title"></span></div>
      <div class="hpwrap"><div class="hpghost" id="p1ghost"></div><div class="hpfill" id="p1hp"></div></div>
      <div class="pips" id="p1pips"><span class="pip"></span><span class="pip"></span></div>
    </div>
    <div id="center"><div id="roundlbl">Round 1</div><div id="timer">75</div></div>
    <div class="side r">
      <div class="nameplate"><span class="pname" id="p2name">—</span><span class="ptitle" id="p2title"></span></div>
      <div class="hpwrap"><div class="hpghost" id="p2ghost"></div><div class="hpfill" id="p2hp"></div></div>
      <div class="pips" id="p2pips"><span class="pip"></span><span class="pip"></span></div>
    </div>
  </div>
  <div id="tg1" class="tgbadge"><span class="tgi">⚔</span><span class="tgt">Attack</span></div>
  <div id="tg2" class="tgbadge"><span class="tgi">⚔</span><span class="tgt">Attack</span></div>
  <div id="st1" class="tgbadge stun"><span class="tgi">💫</span><span class="tgt">Stunned</span></div>
  <div id="st2" class="tgbadge stun"><span class="tgi">💫</span><span class="tgt">Stunned</span></div>

  <div id="controls">
    <div class="pad" id="pad1">
      <div class="tri">
        <button class="btn atk" data-p="0" data-m="attack"><span class="ico">⚔️</span><span class="lab">Attack</span></button>
        <button class="btn grb" data-p="0" data-m="grab"><span class="ico">🤜</span><span class="lab">Grab</span></button>
        <button class="btn grd" data-p="0" id="g0"><span class="ico">🛡️</span><span class="lab">Defend</span></button>
        <div class="ultwrap">
          <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"></circle><circle class="ring-fill" id="p1ring" cx="50" cy="50" r="42"></circle></svg>
          <button class="ultbtn" id="p1ult">Ult</button>
        </div>
      </div>
    </div>
    <div class="pad" id="pad2">
      <div class="tri">
        <button class="btn atk" data-p="1" data-m="attack"><span class="ico">⚔️</span><span class="lab">Attack</span></button>
        <button class="btn grb" data-p="1" data-m="grab"><span class="ico">🤜</span><span class="lab">Grab</span></button>
        <button class="btn grd" data-p="1" id="g1"><span class="ico">🛡️</span><span class="lab">Defend</span></button>
        <div class="ultwrap">
          <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"></circle><circle class="ring-fill" id="p2ring" cx="50" cy="50" r="42"></circle></svg>
          <button class="ultbtn" id="p2ult">Ult</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="announce"><span></span></div>

<div class="screen show" id="title">
  <div class="logo">Clash of Dragons</div>
  <div class="chart">
    <svg viewBox="0 0 320 312" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      <defs>
        <marker id="ah" markerWidth="6" markerHeight="6" refX="3.4" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#e8b84b"></path></marker>
        <radialGradient id="gA" cx="38%" cy="30%"><stop offset="0%" stop-color="#ff8a7e"/><stop offset="100%" stop-color="#c41d12"/></radialGradient>
        <radialGradient id="gD" cx="38%" cy="30%"><stop offset="0%" stop-color="#86dcff"/><stop offset="100%" stop-color="#137bb8"/></radialGradient>
        <radialGradient id="gG" cx="38%" cy="30%"><stop offset="0%" stop-color="#7ff0ad"/><stop offset="100%" stop-color="#16934f"/></radialGradient>
      </defs>
      <circle cx="160" cy="160" r="100" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
      <path class="arc" d="M207,72 A100,100 0 0 1 260,163.5" marker-end="url(#ah)"></path>
      <path class="arc" d="M213,244.8 A100,100 0 0 1 107,244.8" marker-end="url(#ah)"></path>
      <path class="arc" d="M60,163.5 A100,100 0 0 1 113,72" marker-end="url(#ah)"></path>
      <g>
        <circle cx="160" cy="60" r="38" fill="url(#gA)" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
        <text class="ndicon" x="160" y="52" font-size="26">⚔️</text>
        <text class="ndlabel" x="160" y="74" font-size="15">Attack</text>
      </g>
      <g>

      tone(t,mtof(45),0.4,{type:'sawtooth',gain:0.24,release:0.2,filter:'lowpass',cutoff:1800});
      noise(t,0.3,{filter:'lowpass',cutoff:900,gain:0.2}); tone(t+0.05,mtof(57),0.35,{type:'square',gain:0.13,release:0.2}); },
    victory(){ ensure(); const t=ctx&&ctx.currentTime; if(t==null) return;
      [69,73,76,81].forEach((m,k)=> tone(t+k*0.13, mtof(m), 1.0, {type:'sawtooth', gain:0.15, attack:0.01, release:0.6, filter:'lowpass', cutoff:3200}));

  function mnote(t,freq,dur,o){ tone(t,freq,dur,Object.assign({bus:musicBus},o)); }
  function menuBeat(t, beat, spb){
    const b=beat%16, bar=Math.floor(b/4);
    const roots=[45,41,48,43];                                   // Am F C G
    const chords=[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]];
    const ch=chords[bar];
    if(b%4===0){ ch.forEach(m=> mnote(t, mtof(m), spb*3.8, {type:'triangle', gain:0.05, attack:0.45, release:1.2, filter:'lowpass', cutoff:1700}));

    mnote(t, mtof(ch[beat%ch.length]+12), spb*0.9, {type:'sine', gain:0.06, attack:0.01, release:0.3});
    mnote(t+spb*0.5, mtof(ch[(beat+2)%ch.length]+12), spb*0.5, {type:'sine', gain:0.045, attack:0.01, release:0.2});
    if(b===2||b===10){ [76,74,72,69].forEach((m,k)=> mnote(t+k*spb*0.5, mtof(m), spb*0.6,{type:'triangle',gain:0.08,attack:0.02,release:0.3,filter:'lowpass',cutoff:2600})); }
  }

    if(inBar===1||inBar===3){ noise(t,0.18,{filter:'highpass',cutoff:1800,gain:0.28,bus:musicBus}); tone(t,210,0.12,{type:'triangle',gain:0.11,release:0.1,bus:musicBus}); }
    noise(t,0.04,{filter:'highpass',cutoff:8500,gain:0.07,bus:musicBus});
    noise(t+spb*0.5, beat%2?0.11:0.04, {filter:'highpass',cutoff:8500,gain:beat%2?0.06:0.05,bus:musicBus});
    const bassRoot=[33,33,29,31][bar];                           // A1 A1 F1 G1
    mnote(t, mtof(bassRoot), spb*0.45, {type:'sawtooth', gain:0.18, attack:0.005, release:0.08, filter:'lowpass', cutoff:1300});
    mnote(t+spb*0.5, mtof(bassRoot+(b%2?7:0)), spb*0.45, {type:'sawtooth', gain:0.15, attack:0.005, release:0.08, filter:'lowpass', cutoff:1300});
    const riff=[69,76,72,74, 69,72,76,79, 65,72,69,77, 67,74,71,79];
    const r=riff[b]; if(r>0) mnote(t, mtof(r), spb*0.55, {type:'square', gain:0.085, attack:0.005, release:0.12, filter:'lowpass', cutoff:2800});
    if(inBar===0){ [[57,60,64],[57,60,64],[53,57,60],[55,59,62]][bar].forEach(m=> mnote(t, mtof(m), spb*0.6,{type:'sawtooth',gain:0.045,attack:0.005,release:0.2,filter:'lowpass',cutoff:2000})); }
  }
  function startTrack(name){ if(curName===name && cur) return; stopTrack(); if(!ctx) return; curName=name;
    const bpm = name==='battle'?142:84, spb=60/bpm, start=ctx.currentTime+0.12, fn=name==='battle'?battleBeat:menuBeat;
    let beat=0, stopped=false, timer=null;
    (function tick(){ if(stopped) return; const ahead=ctx.currentTime+0.25;
      while(start+beat*spb < ahead){ fn(start+beat*spb, beat, spb); beat++; }
      timer=setTimeout(tick,60); })();
    cur={ stop(){ stopped=true; clearTimeout(timer); } };
  }
  function stopTrack(){ if(cur){ cur.stop(); cur=null; } curName=null; }
  return { unlock(){ ensure(); }, fx,
    playMusic(name){ ensure(); startTrack(name); }, stopMusic(){ stopTrack(); } };
})();

/* Procedural cobblestone: seamless Voronoi stones with mortar joints, plus
   matching bump + roughness maps so light catches the rounded, hand-laid tops. */
function makeCobbleTextures(size, cells){
  const mk=()=>{ const c=document.createElement('canvas'); c.width=c.height=size; return c; };
  const colC=mk(), bmpC=mk(), rufC=mk();
  const cx=colC.getContext('2d'), bx=bmpC.getContext('2d'), rx=rufC.getContext('2d');
  const cI=cx.createImageData(size,size), bI=bx.createImageData(size,size), rI=rx.createImageData(size,size);
  const cD=cI.data, bD=bI.data, rD=rI.data;
  const step=size/cells;
  let s=20240611>>>0; const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  // one jittered seed per grid cell (stored in a grid for fast nearest lookup)
  const grid=[];
  for(let gy=0;gy<cells;gy++){ grid[gy]=[];
    for(let gx=0;gx<cells;gx++){
      grid[gy][gx]={ x:(gx+0.5+(rnd()-0.5)*0.72)*step, y:(gy+0.5+(rnd()-0.5)*0.72)*step,
        tone:0.5+rnd()*0.5, warm:(rnd()-0.5), seed:rnd()*1000 }; } }
  const tor=(ax,ay,bx2,by2)=>{ let dx=Math.abs(ax-bx2); if(dx>size/2) dx=size-dx;
    let dy=Math.abs(ay-by2); if(dy>size/2) dy=size-dy; return dx*dx+dy*dy; };
  const mortarW=step*0.13, mortar=[18,18,21];
  for(let y=0;y<size;y++){ const gy0=Math.floor(y/step);
    for(let x=0;x<size;x++){ const gx0=Math.floor(x/step);
      let best=1e18, second=1e18, bc=null;
      for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
        const sd=grid[((gy0+oy)%cells+cells)%cells][((gx0+ox)%cells+cells)%cells];
        const d=tor(x,y,sd.x,sd.y);
        if(d<best){ second=best; best=d; bc=sd; } else if(d<second){ second=d; } }
      const edge=Math.sqrt(second)-Math.sqrt(best);     // distance to nearest joint
      const m=Math.min(1,edge/mortarW);                 // 0 in mortar -> 1 in stone
      const dome=Math.sqrt(m);                           // rounded cobble profile
      const g=(Math.sin(x*0.7+bc.seed)*Math.cos(y*0.6+bc.seed*1.7))*0.5
             +(Math.sin(x*2.3-bc.seed)*Math.sin(y*2.1+bc.seed))*0.25;
      const i=(y*size+x)*4, eb=Math.min(1,edge/(mortarW*1.25)), lit=0.55+0.5*dome, baseV=38+bc.tone*40;
      let r=baseV*lit+bc.warm*9+g*5, gn=baseV*lit+bc.warm*3+g*5, b=baseV*lit-bc.warm*7+g*5;
      cD[i]  =mortar[0]+(r -mortar[0])*eb;
      cD[i+1]=mortar[1]+(gn-mortar[1])*eb;
      cD[i+2]=mortar[2]+(b -mortar[2])*eb; cD[i+3]=255;
      let h=(m<=0?0.12:0.42+0.5*dome)+g*0.06; h=h<0?0:h>1?1:h;
      bD[i]=bD[i+1]=bD[i+2]=h*255; bD[i+3]=255;
      let ru=(m<=0?0.98:0.74+0.2*(1-dome))-g*0.05; ru=ru<0?0:ru>1?1:ru;
      rD[i]=rD[i+1]=rD[i+2]=ru*255; rD[i+3]=255;
    } }
  cx.putImageData(cI,0,0); bx.putImageData(bI,0,0); rx.putImageData(rI,0,0);
  return { map:new THREE.CanvasTexture(colC), bump:new THREE.CanvasTexture(bmpC), rough:new THREE.CanvasTexture(rufC) };
}

/* ============================ DRAGON MODEL (uploaded OBJ, recolored per dragon) ============================ */
let BASE=null;
// Auto-rig (positions in model-local space: +Z head, -Z tail, +Y up, X width)
const BONES=[
  {n:'hips', p:-1, pos:[0,1.9,-0.4]},
  {n:'chest',p:0,  pos:[0,2.05,0.7]},
  {n:'neck', p:1,  pos:[0,2.55,1.5]},
  {n:'neck2',p:2,  pos:[0,2.95,2.1]},
  {n:'head', p:3,  pos:[0,3.3,2.7]},
  {n:'tail1',p:0,  pos:[0,1.4,-1.4]},
  {n:'tail2',p:5,  pos:[0,0.9,-2.4]},
  {n:'wingL',p:1,  pos:[-0.45,2.5,0.2]},
  {n:'wingR',p:1,  pos:[0.45,2.5,0.2]},
];
function initGeometry(){
  const D=JSON.parse(document.getElementById('dragonData').textContent);
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(D.p, 3));
  geom.setIndex(D.i);
  geom.computeVertexNormals();
  geom.computeBoundingBox();
  const bb=geom.boundingBox;
  BASE={ geom, height:(bb.max.y-bb.min.y)||1, maxAbsX:Math.max(Math.abs(bb.min.x),Math.abs(bb.max.x))||1 };
  computeSkin();
}
function computeSkin(){
  const pos=BASE.geom.attributes.position.array, n=pos.length/3;
  const si=new Uint16Array(n*4), sw=new Float32Array(n*4);
  const sm=(e0,e1,t)=>{ t=Math.max(0,Math.min(1,(t-e0)/(e1-e0))); return t*t*(3-2*t); };
  for(let v=0;v<n;v++){
    const x=pos[v*3], y=pos[v*3+1], z=pos[v*3+2], ax=Math.abs(x);
    let pairs;
    if(ax>0.5 && y>2.15){ const w=(x<0?7:8), ww=Math.min(0.92,0.5+(ax-0.5)*1.1); pairs=[[w,ww],[1,1-ww]]; }      // wings
    else if(z>1.4 && y>1.35){ // neck chain chest->neck->neck2->head, smooth (no bulge)
      if(z<1.9){ const u=sm(1.3,1.9,z); pairs=[[2,u],[1,1-u]]; }
      else if(z<2.35){ const u=sm(1.9,2.35,z); pairs=[[3,u],[2,1-u]]; }
      else { const u=sm(2.35,2.95,z); pairs=[[4,u],[3,1-u]]; } }
    else if(z<-1.0 && y<2.1){ pairs = z<-2.0 ? [[6,0.8],[5,0.2]] : [[5,0.7],[0,0.3]]; }                          // tail
    else if(y<1.1){ pairs=[[0,1.0]]; }                                                                           // legs planted
    else { pairs = z>0.3 ? [[1,0.65],[0,0.35]] : [[0,0.7],[1,0.3]]; }                                            // torso
    for(let s=0;s<4;s++){ si[v*4+s]= s<pairs.length?pairs[s][0]:0; sw[v*4+s]= s<pairs.length?pairs[s][1]:0; }
  }
  BASE.geom.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si,4));
  BASE.geom.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw,4));
}
function colorFor(d){
  const pos=BASE.geom.attributes.position.array, n=pos.length/3;
  const colors=new Float32Array(n*3);
  const H=BASE.height, mx=BASE.maxAbsX;
  const body=new THREE.Color(d.body), body2=new THREE.Color(d.body2), spike=new THREE.Color(d.spike), acc=new THREE.Color(d.accent);
  const ss=(e0,e1,x)=>{ x=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return x*x*(3-2*x); };
  const c=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos[i*3], y=pos[i*3+1];
    const ny=y/H, nx=Math.abs(x)/mx;
    c.copy(body);
    if(nx>0.5 && ny>0.4) c.lerp(body2, ss(0.5,1.0,nx)*0.8);        // wings / outer membrane -> deeper shade
    if(nx<0.34){
      c.lerp(spike, ss(0.58,0.82,ny));                              // dorsal ridge spikes
      c.lerp(acc,   ss(0.86,1.0,ny));                               // gold tips
    }
    if(ny<0.18 && nx<0.5) c.lerp(body2, 0.35);                      // belly shading
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  return colors;
}

    else { const just=(now-(b.guardStart||0))<=CONFIG.PARRY_WINDOW;

function advance(i,dt){ const p=P[i]; if(phase!=='fight'&&phase!=='between') return; if(p.hp<=0) return; if(now<p.stunUntil) return;

    if(p.t>=dur){ p.phase='strike'; p.t=0; resolveStrike(i); } }
  else if(p.phase==='strike'){ p.t+=dt*1000; if(p.t>=CONFIG.STRIKE && p.phase==='strike') setRecover(i,CONFIG.WIN_RECOVER); }
  else if(p.phase==='recover'){ p.t+=dt*1000; if(p.t>=p.dur){ p.phase='idle'; p.move=null; p.t=0; p.resolved=false; } }
  if(p.minions && now>=p.minionNext){ p.minionNext=now+1200; const foe=1-i;
    if(P[foe].hp>0){ applyDamage(foe,2); burst(dragon[foe].group.position.clone().setY(2.0),DRAGONS[pick[i]].body,6,0.6,3); } } }
function checkRoundEnd(){ if(phase!=='fight') return;
  if(P[0].hp<=0&&P[1].hp<=0) endRound(P[0].hp>=P[1].hp?0:1);
  else if(P[1].hp<=0) endRound(0); else if(P[0].hp<=0) endRound(1);
  else if(timeLeft<=0){ if(P[0].hp===P[1].hp){ announce('Draw'); inputEnabled=false; phase='between'; setTimeout(startRound,1600); }
    else endRound(P[0].hp>P[1].hp?0:1); } }

/* ============================ ANIMATION (skeletal) ============================ */
function lerp(a,b,t){return a+(b-a)*t;}
function poseDragon(i,time){ const dr=dragon[i]; if(!dr) return; const p=P[i], an=p.anim, B=dr.parts.bones;
  let body=0, neck=0, flap=0.16, wfwd=0, inw=0, roll=0, glow=0, sink=0, lunge=0, hit=0, wooze=0, glowCol=TG.attack;
  const stunned=now<p.stunUntil;
  if(p.hp<=0){ sink=1; body=0.2; neck=-0.7; flap=0.15; wfwd=0.1; roll=0; }
  else if(stunned){ wooze=1; glow=0.5; glowCol=p.freeze?0x9fd8ff:0xcbd2ef; flap=-0.05; }
  else if(p.phase==='windup'){ glow=1; glowCol=TG[p.move]||TG.attack;
    if(p.move==='attack'){ body=0.45; neck=0.55; flap=0.4; }                          // ATTACK windup: lean back & coil
    else if(p.move==='grab'){ body=-0.28; neck=0.35; flap=0.6; wfwd=0.55; inw=-0.55; } }   // GRAB windup: hunch forward, wings spread wide to seize
  else if(p.phase==='strike'){
    if(p.move==='attack'){ body=-0.3; neck=-0.4; wfwd=0.5; flap=-0.1; lunge=0.7; }    // ATTACK strike: claw forward
    else { body=-0.35; neck=0.2; flap=0.05; wfwd=1.0; inw=0.7; lunge=1.0; } }          // GRAB strike: lunge in, wings clamp
  else if(p.phase==='guard'){ wfwd=1.05; inw=0.45; neck=-0.25; body=0.12; flap=0.05; glow=0.45; glowCol=TG.guard; } // wings shield in front
  else if(p.phase==='recover'){ if(p.move==='hurt'){ body=0.5; neck=0.7; roll=0.3; flap=-0.35; hit=1; }            // HURT: rolled knockback
    else if(p.move==='ult'){ body=-0.2; neck=0.3; glow=1; glowCol=(pick[i]!=null&&DRAGONS[pick[i]])?DRAGONS[pick[i]].body:TG.attack; flap=0.85; wfwd=0.3; }
    else if(p.move==='attack'){ body=-0.2; neck=-0.3; wfwd=0.45; flap=-0.05; lunge=0.5; }                           // ATTACK follow-through
    else if(p.move==='grab'){ body=-0.25; neck=0.15; wfwd=0.95; inw=0.65; flap=0.05; lunge=0.7; } }                 // GRAB clutch follow-through
  if(p.hitFlash>0) hit=Math.max(hit,p.hitFlash);

  const k=Math.min(1,time*11);
  an.body=lerp(an.body,body,k); an.neck=lerp(an.neck,neck,k); an.flap=lerp(an.flap,flap,k);
  an.wfwd=lerp(an.wfwd,wfwd,k); an.inw=lerp(an.inw,inw,k); an.roll=lerp(an.roll,roll,k);
  an.glow=lerp(an.glow,glow,Math.min(1,time*16)); an.sink=lerp(an.sink,sink,Math.min(1,time*4));
  an.lunge=lerp(an.lunge,lunge,k); an.hit=lerp(an.hit,hit,k); an.wooze=lerp(an.wooze,wooze,Math.min(1,time*6));
  p.hitFlash=Math.max(0,p.hitFlash-time*4);

  const T=performance.now(), face=SIDE[i].face, g=dr.group, woz=an.wooze, ko=an.sink;
  g.position.x = SIDE[i].x + face*an.lunge*0.8 - face*an.hit*0.6;   // modest lunge -> no clipping
  g.position.y = ko*1.12;                       // rise as it topples so the flank rests on the floor (verified: lift 1.12 @ ~87deg)
  g.rotation.x = ko*1.52;                        // fall sideways onto its flank (about the head-tail axis)
  g.rotation.z = ko*0.12*face;                   // slight roll as it goes down
  const bob=Math.sin(T*0.003+i)*0.04, sway=Math.sin(T*0.0022+i)*0.2, idleFlap=Math.sin(T*0.004+i)*0.12;
  B[0].rotation.z = an.roll*face + woz*Math.sin(T*0.012)*0.12;                 // hips twist (flinch)
  B[1].rotation.x = -an.body*0.30;                                            // chest pitch
  B[2].rotation.x = -an.neck*0.18 + bob + woz*Math.sin(T*0.011)*0.16;         // neck bend distributed
  B[3].rotation.x = -an.neck*0.18 + woz*Math.sin(T*0.013)*0.16;
  B[4].rotation.x = -an.neck*0.10 + woz*Math.sin(T*0.015)*0.14;
  B[3].rotation.y = woz*Math.sin(T*0.009)*0.22;
  B[5].rotation.y = sway + woz*Math.sin(T*0.01)*0.25; B[6].rotation.y = sway*1.4; B[5].rotation.x = an.sink*0.4; // tail
  const fl=an.flap+idleFlap;
  B[7].rotation.x = an.wfwd*1.25; B[7].rotation.y = an.inw;  B[7].rotation.z = -fl;   // wings: forward pitch + flap
  B[8].rotation.x = an.wfwd*1.25; B[8].rotation.y = -an.inw; B[8].rotation.z =  fl;

  const col=new THREE.Color(glowCol), m=dr.glowMats[0];
  m.emissive.copy(col); m.emissiveIntensity = an.glow*0.7 + 0.03;
  if(p.hitFlash>0.01){ m.emissive.lerp(new THREE.Color(0xffffff),p.hitFlash); m.emissiveIntensity=Math.max(m.emissiveIntensity,p.hitFlash); }
  if(p.minionMesh){ p.minionMesh.position.copy(g.position);
    if(p.minionOrbits){ const Tm=performance.now();
      for(const o of p.minionOrbits){ const a=o.ph + o.dir*Tm*o.spd;
        const x=Math.cos(a)*o.r, z=Math.sin(a)*o.r*o.rz, y=o.baseY+Math.sin(a*o.tf+o.ph)*o.ySwing;
        o.mesh.position.set(x,y,z);
        const vx=-Math.sin(a)*o.dir, vz=Math.cos(a)*o.rz*o.dir;       // travel tangent -> face direction of flight
        o.mesh.rotation.set(Math.sin(a*o.tf)*0.18, Math.atan2(-vz,vx), Math.sin(a)*0.3*o.dir); // bank into the turn
      } } }
}

/* ============================ HUD ============================ */
let lastHp=[CONFIG.HP,CONFIG.HP];
function updateBadges(i){ const p=P[i];
  const tg=$('tg'+(i+1)); if(p.phase==='windup'&&(p.move==='attack'||p.move==='grab')){
    if(!tg.classList.contains('show')){ tg.classList.add('show'); tg.style.color=hex(TG[p.move]);
      tg.querySelector('.tgi').textContent=p.move==='attack'?'⚔':'✊'; tg.querySelector('.tgt').textContent=p.move==='attack'?'Attack':'Grab'; }
  } else tg.classList.remove('show');
  $('st'+(i+1)).classList.toggle('show', now<p.stunUntil && p.hp>0);
}
function syncHUD(){ [0,1].forEach(i=>{ const p=P[i];
  $('p'+(i+1)+'hp').style.width=(p.hp/CONFIG.HP*100)+'%';
  $('p'+(i+1)+'ghost').style.width=(Math.max(p.hp,lastHp[i])/CONFIG.HP*100)+'%'; lastHp[i]=p.hp;
  setRing($('p'+(i+1)+'ring'),p.meter/CONFIG.MAX_METER);
  const pips=$('p'+(i+1)+'pips').children; for(let k=0;k<2;k++) pips[k].classList.toggle('on',p.wins>k);
  const ub=$('p'+(i+1)+'ult'), ready=p.meter>=CONFIG.MAX_METER&&p.hp>0&&pick[i]!=null; ub.classList.toggle('ready',ready);
  ub.style.background = ready?`radial-gradient(circle at 38% 30%, #fff, ${hex(DRAGONS[pick[i]].body)})`:'radial-gradient(circle at 38% 30%,rgba(255,255,255,.12),rgba(0,0,0,.5))';
  const able=canAct(i); $('pad'+(i+1)).querySelectorAll('.btn[data-m]').forEach(b=>{ b.classList.toggle('locked',!able); b.disabled=!able; });
  const gb=$('g'+i); gb.classList.toggle('held',p.phase==='guard'); gb.classList.toggle('locked',!able&&p.phase!=='guard'); }); }

/* ============================ LOOP ============================ */
let prev=performance.now();
function loop(t){ const dt=Math.min(0.05,(t-prev)/1000); prev=t; now=t;
  if(phase==='fight'){ timeLeft=Math.max(0,timeLeft-dt); $('timer').textContent=Math.ceil(timeLeft); $('timer').classList.toggle('low',timeLeft<=10); }
  advance(0,dt); advance(1,dt); checkRoundEnd();
  if(dragon[0]) poseDragon(0,dt); if(dragon[1]) poseDragon(1,dt); updateFx(dt); updateArena(dt);
  updateBadges(0); updateBadges(1); syncHUD();
  shake=Math.max(0,shake-dt*2.5);
  camera.position.set(CAM_BASE.x+(Math.random()-0.5)*shake, CAM_BASE.y+(Math.random()-0.5)*shake, CAM_BASE.z);
  camera.lookAt(0,2.1,0); renderer.render(scene,camera); requestAnimationFrame(loop); }
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  if($('select').classList.contains('show')) [0,1].forEach(p=>{ if(pick[p]!=null){
    const card=document.querySelector('#cards .card[data-idx="'+pick[p]+'"]'); if(card) placeTokOnCard($('tok'+p),card); } }); }

initGeometry();
window.addEventListener('resize',resize); resize(); show('title'); syncHUD(); requestAnimationFrame(loop);

// Audio can only start after a user gesture in most browsers; unlock on first
// interaction and (re)start menu music whenever we're on a menu screen.
function audioGesture(){ Sound.unlock();
  const onMenu = ['title','select','result'].some(id=>{ const e=$(id); return e && e.classList.contains('show'); });
  if(onMenu) Sound.playMusic('menu'); }
['pointerdown','keydown','touchstart'].forEach(ev=> window.addEventListener(ev, audioGesture));
// Best-effort: begin the menu theme right away on the title screen (resumes on
// the first interaction if the browser blocks autoplay).
Sound.playMusic('menu');

})(); }
</script>
